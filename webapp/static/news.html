<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News desk · Gameday</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #5d6470;
    --line: #dde1e7; --accent: #1f6feb; --accent-text: #ffffff; --accent-soft: #e8f0fe;
    --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e6e8ec; --muted: #9aa3af;
      --line: #2a2f3a; --accent: #4c8dff; --accent-text: #0f1115; --accent-soft: #1b2638;
      --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
  nav.top { display: flex; gap: 18px; margin-bottom: 14px; font-size: 14px; }
  nav.top a { color: var(--muted); text-decoration: none; padding-bottom: 4px; }
  nav.top a[aria-current] { color: var(--text); font-weight: 600; border-bottom: 2px solid var(--accent); }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  .fresh { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 6px 0 14px; }
  .fresh .stale { color: var(--bad); font-weight: 600; }
  form.ask { display: grid; grid-template-columns: 1fr 210px auto auto; gap: 8px; }
  @media (max-width: 680px) { form.ask { grid-template-columns: 1fr 1fr; } form.ask input { grid-column: 1 / -1; } }
  input, select, textarea { padding: 10px 11px; border: 1px solid var(--line); border-radius: 7px;
                            background: var(--bg); color: var(--text); font: inherit; width: 100%; }
  button { padding: 9px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--card);
           color: var(--text); font: inherit; cursor: pointer; white-space: nowrap; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .6; cursor: default; }
  button.chip { padding: 4px 11px; border-radius: 999px; font-size: 13px; }
  button.chip.on { border-color: var(--accent); color: var(--accent); }
  .tries { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .digest { margin-top: 12px; font-size: 14px; }
  .digest b { font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .answer { font-size: 16px; line-height: 1.65; overflow-wrap: anywhere; }
  a.cite { color: var(--accent); text-decoration: none; font-weight: 600; padding: 0 1px; font-size: 12px; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.bad { color: var(--bad); border-color: var(--bad); }
  .banner { margin-top: 12px; padding: 9px 12px; border-radius: 7px; background: var(--accent-soft); font-size: 13px; }
  .empty-answer { border: 1px dashed var(--line); border-radius: 8px; padding: 14px; }
  details.trace { margin-top: 14px; font-size: 13px; }
  details.trace summary { cursor: pointer; color: var(--muted); }
  .steps { margin: 8px 0 0; padding-left: 18px; color: var(--muted); }
  .src { border-left: 3px solid var(--line); padding: 6px 0 6px 10px; margin-bottom: 10px; scroll-margin-top: 80px; }
  .src.cited { border-left-color: var(--accent); }
  .src.hit { background: var(--accent-soft); transition: background .3s; }
  .src .n { font-weight: 700; color: var(--accent); margin-right: 6px; }
  .src .when { font-size: 12px; color: var(--muted); }
  .src .text { font-size: 14px; overflow-wrap: anywhere; }
  .src a { color: var(--accent); }
  .feedback { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .feedback .msg { font-size: 13px; color: var(--ok); }
  .wrongpick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; width: 100%; }
  .msg.bad { color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <nav class="top"><a href="/">Lineup</a><a href="/news" aria-current="page">News desk</a></nav>
  <header>
    <h1>News desk</h1>
    <span id="who" class="muted"></span>
  </header>

  <section id="signin" class="card" hidden>
    <p>Sign in on the <a href="/">Lineup page</a> first, then come back.</p>
  </section>

  <section id="app" hidden>
    <div class="fresh" id="fresh"><span>Archive: ESPN player notes (RotoWire) and stories since training camp, refreshed daily</span></div>

    <div class="card">
      <form id="ask" class="ask">
        <input id="q" type="search" maxlength="300" aria-label="Question" autocomplete="off"
               placeholder="Ask about NFL news, e.g. is his hamstring a recurring problem?">
        <select id="player" aria-label="Player"></select>
        <button type="submit" value="search" title="The retriever alone: ranked passages, no AI">Search</button>
        <button class="primary" type="submit" value="ask" title="Cited answer from the archive">Ask</button>
      </form>
      <div class="tries" id="tries"></div>
      <div class="digest" id="digest"></div>
    </div>

    <div id="out"></div>
  </section>
</main>
<script type="module" src="/static/news.js"></script>
</body>
</html>
