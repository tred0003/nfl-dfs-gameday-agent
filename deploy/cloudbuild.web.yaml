# Builds the web app image. Same reason as cloudbuild.reports.yaml for a
# checked-in config rather than `--tag`: the Dockerfile is not at the root.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'deploy/Dockerfile.web', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
options:
  logging: CLOUD_LOGGING_ONLY
