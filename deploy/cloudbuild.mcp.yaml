# Builds the news-archive MCP server image. Same reason as cloudbuild.news.yaml
# for a checked-in config rather than `--tag`: the Dockerfile is not at the root.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'deploy/Dockerfile.mcp', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
options:
  logging: CLOUD_LOGGING_ONLY
