# Deploy the gameday agent from the pipeline, not the laptop (trigger
# `nfl-dfs-deploy`, manual only, runs as agent-deployer@).
#
# Why: both laptop deploy paths have failed on Windows itself -- Smart App
# Control blocked a pandas DLL on 10/6 and the whole ffml python.exe on 10/15.
# A clean container from the committed code is also more honest: what ships
# is exactly what is in git, not whatever else sits in the working folder.
#
# Order is the point. The agent is only redeployed if the unit tests AND the
# eval gate pass on this exact commit; a failed step stops the build.
# Redeployed IN PLACE (same resource ID), so AGENT_ENGINE_ID in the clients
# does not change.
#
#   gcloud builds triggers run nfl-dfs-deploy --project advisor-agent-2026 \
#     --region us-central1 --branch master
substitutions:
  _AGENT_ENGINE_ID: '3925664979730038784'
steps:
  - id: unit-tests
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet --no-cache-dir --root-user-action=ignore -r deploy/requirements-ci.txt
        python -m unittest discover -s tests

  - id: eval-gate
    name: python:3.11-slim
    entrypoint: bash
    env:
      - GOOGLE_GENAI_USE_VERTEXAI=TRUE
      - GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - GOOGLE_CLOUD_LOCATION=us-central1
    args:
      - -c
      - |
        pip install --quiet --no-cache-dir --root-user-action=ignore -r gameday_agent/requirements.txt
        python gameday_agent/eval/run_eval.py --no-judge

  - id: deploy
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -o pipefail
        # The adk CLI imports vertexai to deploy; the agent's own requirements
        # do not include it (the laptop env happened to). Same pin as
        # requirements-reports.txt and the laptop's 10/9 deploy.
        pip install --quiet --no-cache-dir --root-user-action=ignore \
          -r gameday_agent/requirements.txt "google-cloud-aiplatform[agent_engines]==1.162.0"
        cp gameday_agent/deploy.env gameday_agent/.env
        date -u +%Y-%m-%dT%H:%M:%SZ > /workspace/deploy_started
        # --otel_to_cloud keeps telemetry on; a redeploy without it silently
        # drops it (REPORTS-CLOUD.md, Phase 2).
        adk deploy agent_engine --project $PROJECT_ID --region us-central1 \
          --agent_engine_id ${_AGENT_ENGINE_ID} --otel_to_cloud \
          --extra_packages src gameday_agent 2>&1 | tee /workspace/deploy.log
        # `adk deploy` prints "Deploy failed: ..." and still exits 0. The first
        # pipeline run (1f966f3c) went green having deployed nothing.
        if grep -q "Deploy failed" /workspace/deploy.log; then exit 1; fi

  # Do not trust the deploy's own word: read the live agent back and fail
  # unless it was updated during this build and carries deploy.env's settings.
  - id: verify-deployed
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet --no-cache-dir --root-user-action=ignore google-auth requests
        python - <<'PY'
        import google.auth, google.auth.transport.requests as tr
        creds, _ = google.auth.default(scopes=["https://www.googleapis.com/auth/cloud-platform"])
        s = tr.AuthorizedSession(creds)
        url = ("https://us-central1-aiplatform.googleapis.com/v1/projects/$PROJECT_ID"
               "/locations/us-central1/reasoningEngines/${_AGENT_ENGINE_ID}")
        eng = s.get(url).json()
        started = open("/workspace/deploy_started").read().strip()
        env = {e["name"]: e.get("value") for e in eng["spec"]["deploymentSpec"].get("env", [])}
        want = dict(l.split("=", 1) for l in open("gameday_agent/deploy.env").read().splitlines()
                    if l.strip() and not l.startswith("#") and "=" in l)
        want.pop("GOOGLE_CLOUD_PROJECT", None)   # adk keeps these out of the agent's env
        print("updateTime", eng["updateTime"], "deploy started", started)
        assert eng["updateTime"] >= started, "agent was not updated by this build"
        wrong = {k: (env.get(k), v) for k, v in want.items() if env.get(k) != v}
        assert not wrong, f"deployed env differs from deploy.env: {wrong}"
        print("verified: agent updated in this build, env matches deploy.env")
        PY
timeout: 3600s
options:
  logging: CLOUD_LOGGING_ONLY
